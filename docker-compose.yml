name: jd-auto

services:
  qinglong:
    image: whyour/qinglong:latest
    container_name: ql
    restart: unless-stopped
    ports:
      - "${QL_PORT:-5700}:5700"
    volumes:
      - ./ql-data:/ql/data
      - ./data:/ql/data/scripts/local   # 自用脚本目录，容器内路径固定
    environment:
      TZ: Asia/Shanghai
      QlBaseUrl: "/"
      QlPort: "5700"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5700/api/system >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
